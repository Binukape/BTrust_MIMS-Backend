name: Backend CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check src/server.js

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          image=ghcr.io/$owner/btrust-mims-backend
          docker build -t $image:latest -t $image:${{ github.sha }} .
          docker push $image:latest
          docker push $image:${{ github.sha }}

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Update the server
        run: |
          ssh "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" 'bash -s' <<'EOF'
          set -e
          cd /opt/mims
          flock /tmp/mims-deploy.lock sh -c 'docker compose -f docker-compose.prod.yml pull backend && docker compose -f docker-compose.prod.yml up -d'
          EOF

      - name: Check the site
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://${{ secrets.VM_HOST }}/api/health" || true)
            if [ "$code" = "200" ]; then echo "site is healthy"; exit 0; fi
            sleep 10
          done
          echo "site did not become healthy"
          exit 1
